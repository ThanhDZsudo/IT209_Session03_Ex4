# ====================================================
# Server Block 1: Beta App (Uu tien cong 2906 truoc, sau do den 8080)
# ====================================================
server {
    listen 2906;
    listen 8080;
    listen [::]:2906;
    listen [::]:8080;

    server_name _;

    root /var/www/beta-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ====================================================
# Server Block 2: Internal App (Uu tien cong 2907 truoc, sau do den 8090)
# ====================================================
server {
    listen 2907;
    listen 8090;
    listen [::]:2907;
    listen [::]:8090;

    server_name _;

    root /var/www/internal-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}
